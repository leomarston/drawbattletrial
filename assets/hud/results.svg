<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" font-family="Fredoka, system-ui, sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241C53"/>
      <stop offset="1" stop-color="#181436"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="10" y="14" width="540" height="396" rx="26" fill="#15112E"/>
  <rect x="10" y="8" width="540" height="396" rx="26" fill="url(#rbg)" stroke="#1E1B33" stroke-width="3.5"/>

  <!-- title -->
  <text x="280" y="58" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="30">Round Over!</text>

  <!-- revealed word chip -->
  <g transform="translate(180,72)">
    <rect x="0" y="0" width="200" height="44" rx="14" fill="#2DD4BF" stroke="#1E1B33" stroke-width="3"/>
    <text x="100" y="22" text-anchor="middle" fill="#0E3D38" font-family="Nunito" font-weight="800" font-size="11" letter-spacing="1">THE WORD WAS</text>
    <text x="100" y="38" text-anchor="middle" fill="#0E3D38" font-weight="700" font-size="17">ELEPHANT</text>
  </g>

  <!-- ===== PODIUM ===== -->
  <!-- 2nd -->
  <g transform="translate(120,176)">
    <g transform="translate(20,0)">
      <rect x="0" y="0" width="50" height="50" rx="16" fill="#FB5E7E" stroke="#1E1B33" stroke-width="3"/>
      <circle cx="18" cy="22" r="4" fill="#1E1B33"/><circle cx="33" cy="22" r="4" fill="#1E1B33"/>
      <path d="M17 32 q8 5 16 0" fill="none" stroke="#1E1B33" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="0" y="60" width="90" height="104" rx="14" fill="#C1C1C1" stroke="#1E1B33" stroke-width="3"/>
    <text x="45" y="98" text-anchor="middle" fill="#1E1B33" font-weight="700" font-size="30">2</text>
    <text x="45" y="124" text-anchor="middle" fill="#1E1B33" font-family="Nunito" font-weight="800" font-size="14">Leo</text>
    <text x="45" y="146" text-anchor="middle" fill="#3a3a3a" font-family="Nunito" font-weight="700" font-size="13">+90</text>
  </g>

  <!-- 1st (tallest, crown) -->
  <g transform="translate(235,150)">
    <path d="M22 8 L34 20 L45 2 L56 20 L68 8 L64 30 L26 30 Z" fill="#FFD45E" stroke="#1E1B33" stroke-width="2.5" stroke-linejoin="round"/>
    <g transform="translate(20,28)">
      <rect x="0" y="0" width="50" height="50" rx="16" fill="#2DD4BF" stroke="#1E1B33" stroke-width="3"/>
      <circle cx="18" cy="22" r="4" fill="#1E1B33"/><circle cx="33" cy="22" r="4" fill="#1E1B33"/>
      <path d="M16 30 q9 8 18 0" fill="none" stroke="#1E1B33" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="0" y="86" width="90" height="118" rx="14" fill="#FFD45E" stroke="#1E1B33" stroke-width="3"/>
    <text x="45" y="128" text-anchor="middle" fill="#1E1B33" font-weight="700" font-size="34">1</text>
    <text x="45" y="156" text-anchor="middle" fill="#1E1B33" font-family="Nunito" font-weight="800" font-size="15">Maya</text>
    <text x="45" y="180" text-anchor="middle" fill="#7a5c00" font-family="Nunito" font-weight="800" font-size="14">+120</text>
  </g>

  <!-- 3rd -->
  <g transform="translate(350,196)">
    <g transform="translate(20,0)">
      <rect x="0" y="0" width="50" height="50" rx="16" fill="#8B5CF6" stroke="#1E1B33" stroke-width="3"/>
      <circle cx="18" cy="22" r="4" fill="#1E1B33"/><circle cx="33" cy="22" r="4" fill="#1E1B33"/>
      <path d="M18 33 q7 -4 14 0" fill="none" stroke="#1E1B33" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="0" y="60" width="90" height="84" rx="14" fill="#E08A4A" stroke="#1E1B33" stroke-width="3"/>
    <text x="45" y="96" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="28">3</text>
    <text x="45" y="120" text-anchor="middle" fill="#FFFFFF" font-family="Nunito" font-weight="800" font-size="14">Aria</text>
    <text x="45" y="140" text-anchor="middle" fill="#5a2f0c" font-family="Nunito" font-weight="700" font-size="12">+70</text>
  </g>

  <!-- next round button -->
  <g transform="translate(196,352)">
    <rect x="0" y="6" width="168" height="48" rx="15" fill="#C73E5C"/>
    <rect x="0" y="0" width="168" height="48" rx="15" fill="#FB5E7E" stroke="#1E1B33" stroke-width="3"/>
    <text x="84" y="31" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="19">Next Round</text>
  </g>
</svg>
