<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" font-family="Nunito, system-ui, sans-serif">
  <!-- panel -->
  <rect x="6" y="12" width="288" height="342" rx="20" fill="#15112E"/>
  <rect x="6" y="6" width="288" height="342" rx="20" fill="#2E2566" stroke="#1E1B33" stroke-width="3"/>

  <!-- header -->
  <rect x="6" y="6" width="288" height="44" rx="20" fill="#3B2E84"/>
  <rect x="6" y="30" width="288" height="20" fill="#3B2E84"/>
  <text x="24" y="35" fill="#FFFFFF" font-weight="800" font-size="16">Guesses</text>

  <!-- messages -->
  <g font-size="14">
    <!-- normal guess -->
    <g transform="translate(20,62)">
      <text x="0" y="14" fill="#FF9FB3" font-weight="800">Leo</text>
      <text x="34" y="14" fill="#E7E5F5" font-weight="600">tiger?</text>
    </g>
    <!-- normal guess -->
    <g transform="translate(20,88)">
      <text x="0" y="14" fill="#8FD0FF" font-weight="800">Sam</text>
      <text x="40" y="14" fill="#E7E5F5" font-weight="600">a cat!</text>
    </g>
    <!-- system: close -->
    <g transform="translate(20,114)">
      <rect x="-6" y="0" width="252" height="26" rx="9" fill="#3a2f10"/>
      <text x="120" y="18" text-anchor="middle" fill="#FFB23E" font-weight="700" font-style="italic">Sam is close!</text>
    </g>
    <!-- correct guess (lime highlight) -->
    <g transform="translate(14,150)">
      <rect x="0" y="0" width="258" height="34" rx="11" fill="#2c4d12" stroke="#A3E635" stroke-width="2"/>
      <circle cx="20" cy="17" r="9" fill="#A3E635" stroke="#1E1B33" stroke-width="2"/>
      <path d="M16 17 l3 3 l6 -7" fill="none" stroke="#1E1B33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="22" fill="#BEF264" font-weight="800">Maya guessed the word!</text>
    </g>
    <!-- normal guess -->
    <g transform="translate(20,196)">
      <text x="0" y="14" fill="#C9B6FF" font-weight="800">Aria</text>
      <text x="42" y="14" fill="#E7E5F5" font-weight="600">lion</text>
    </g>
    <!-- system: joined -->
    <g transform="translate(20,222)">
      <text x="120" y="14" text-anchor="middle" fill="#7C77A8" font-weight="600" font-style="italic">Kai joined the game</text>
    </g>
  </g>

  <!-- input field -->
  <g transform="translate(18,294)">
    <rect x="0" y="0" width="206" height="46" rx="14" fill="#FFFFFF" stroke="#1E1B33" stroke-width="3"/>
    <text x="16" y="29" fill="#9A95C4" font-weight="600" font-size="14">Type your guess…</text>
    <!-- send button -->
    <g transform="translate(214,0)">
      <rect x="0" y="5" width="46" height="46" rx="14" fill="#1E9C8E"/>
      <rect x="0" y="0" width="46" height="46" rx="14" fill="#2DD4BF" stroke="#1E1B33" stroke-width="3"/>
      <path d="M15 23 L31 16 L26 31 L23 25 Z" fill="#1E1B33" stroke="#1E1B33" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
